name: CI
on:
  push:
    branches: [develop, main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mv
          POSTGRES_PASSWORD: mv
          POSTGRES_DB: mvabrigos
        ports:
          - 5432:5432
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 10

    env:
      DATABASE_URL: postgresql://mv:mv@localhost:5432/mvabrigos?schema=public
      REDIS_URL: redis://localhost:6379/0
      REDIS_TEST_URL: redis://localhost:6379/15
      AUTH_JWT_SECRET: ci-secret-ci-secret-ci-secret-ci-secret-00
      APP_URL: http://localhost:3000
      COOKIE_SECURE: 'false'
      MAIL_FROM: 'MV Abrigos <no-reply@mvabrigosbrasil.com.br>'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm install -g npm@11.6.2
        # npm@11.6.2: this exact version matches package-lock.json (lockfileVersion 3).
        # npm ci fails under npm 10.x or newer npm 11.19.x with "Missing: @emnapi/core@1.11.3".
        # Must match the Dockerfile pin at line 13 and 55.
      - run: npm ci
      - run: npx prisma generate
      - run: npx prisma migrate deploy
      - run: npm run lint
      - run: npm test
      - run: npm run test:import
      - run: npm run test:e2e
      - run: npm run build
